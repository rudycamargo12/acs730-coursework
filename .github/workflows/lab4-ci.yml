
name: Lab 4 CI

on:
  workflow_dispatch:
    inputs:
      cache-mode:
        description: 'Cache mode for timing experiments'
        type: choice
        options:
          - none
          - enabled
        default: none
        required: true
  pull_request:
    paths:
      - 'lab4/**'
      - '.github/workflows/lab4-ci.yml'
      - '.github/workflows/docker-build.yml'
      - '.github/actions/**'
  push:
    branches:
      - main
      - lab4
    paths:
      - 'lab4/**'
      - '.github/workflows/lab4-ci.yml'
      - '.github/workflows/docker-build.yml'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (without pip cache)
        if: github.event_name != 'workflow_dispatch' || inputs.cache-mode == 'none'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (with pip cache)
        if: github.event_name == 'workflow_dispatch' && inputs.cache-mode == 'enabled'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab4/requirements*.txt

      - name: Install dependencies
        uses: ./.github/actions/python-deps
        with:
          requirements-file: lab4/requirements.txt
          dev-requirements-file: lab4/requirements-dev.txt

      - name: Run tests
        run: pytest
        working-directory: ./lab4

  build:
    name: Build Docker image
    needs: test
    uses: ./.github/workflows/docker-build.yml
    with:
      image-tag: sha-${{ github.sha }}
      cache_mode: ${{ inputs.cache-mode || 'none' }}

  smoke:
    name: Container smoke test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Start and test container
        env:
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          docker run -d --name app -p 8000:8000 "acs730-lab4:$TAG"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/healthz; then
              docker exec app whoami
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f app 2>/dev/null || true

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Tag and push image
        env:
          TAG: sha-${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag "acs730-lab4:$TAG" "$IMAGE_LC:$TAG"
          docker push "$IMAGE_LC:$TAG"

  summary:
    name: Pipeline summary
    needs: [test, build, smoke]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          {
            echo "## Lab 4 CI summary"
            echo "- Tests: $TEST_RESULT"
            echo "- Build: $BUILD_RESULT"
            echo "- Smoke test: $SMOKE_RESULT"
            echo "- Image tag: $IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-raise an upstream failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  required-check:
    name: Lab 4 CI
    needs: [test, build, smoke]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          echo "Tests: $TEST_RESULT"
          echo "Build: $BUILD_RESULT"
          echo "Smoke test: $SMOKE_RESULT"

          if [ "$TEST_RESULT" != "success" ] || \
             [ "$BUILD_RESULT" != "success" ] || \
             [ "$SMOKE_RESULT" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi

          echo "All required jobs succeeded."
