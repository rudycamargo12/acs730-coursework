name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      image-tag:
        description: Docker image tag
        required: true
        type: string
      cache_mode:
        description: Docker layer cache mode
        required: false
        type: string
        default: none
    outputs:
      image-tag:
        description: Tag of the built Docker image
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (timed)
        env:
          TAG: ${{ steps.meta.outputs.image-tag }}
          CACHE_MODE: ${{ inputs.cache_mode }}
        run: |
          start_ns=$(date +%s%N)

          if [ "$CACHE_MODE" = "enabled" ]; then
            docker buildx build --load \
              --cache-from type=gha,scope=lab4-docker \
              --cache-to type=gha,mode=max,scope=lab4-docker \
              -f lab4/Dockerfile \
              -t "acs730-lab4:$TAG" \
              lab4/
          else
            docker buildx build --no-cache --load \
              -f lab4/Dockerfile \
              -t "acs730-lab4:$TAG" \
              lab4/
          fi

          end_ns=$(date +%s%N)
          elapsed_ms=$(((end_ns - start_ns) / 1000000))
          echo "DOCKER_BUILD_MS=$elapsed_ms"
          echo "### Docker build timing" >> "$GITHUB_STEP_SUMMARY"
          echo "Cache mode: $CACHE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Duration: ${elapsed_ms} ms" >> "$GITHUB_STEP_SUMMARY"

      - name: Save image
        env:
          TAG: ${{ steps.meta.outputs.image-tag }}
        run: docker save "acs730-lab4:$TAG" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1
