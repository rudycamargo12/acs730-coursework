name: Python dependencies
description: Install application and development dependencies

inputs:
  requirements-file:
    description: Application requirements file
    required: false
    default: lab4/requirements.txt
  dev-requirements-file:
    description: Development requirements file
    required: false
    default: lab4/requirements-dev.txt

runs:
  using: composite
  steps:
    - name: Install Python dependencies (timed)
      shell: bash
      run: |
        start_time=$(date +%s)
        python -m pip install \
          -r "${{ inputs.requirements-file }}" \
          -r "${{ inputs.dev-requirements-file }}"
        end_time=$(date +%s)
        elapsed=$((end_time - start_time))
        echo "PIP_INSTALL_SECONDS=$elapsed"
        echo "### pip install timing" >> "$GITHUB_STEP_SUMMARY"
        echo "Duration: ${elapsed} seconds" >> "$GITHUB_STEP_SUMMARY"
